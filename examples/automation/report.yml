# Copy to .github/workflows/branchquilt-report.yml after following docs/automation.md.
# Stores a downloadable report; does not deploy a website.
name: BranchQuilt report
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions: {}
concurrency:
  group: branchquilt-report
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '9.15.4'
          run_install: false
      - name: Install the pinned tool outside the analyzed repository
        shell: bash
        run: |
          cp -R .branchquilt-tool "$RUNNER_TEMP/branchquilt-tool"
          pnpm --dir "$RUNNER_TEMP/branchquilt-tool" install --frozen-lockfile --ignore-scripts
      - name: Refresh report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --dir "$RUNNER_TEMP/branchquilt-tool" exec branchquilt refresh "$GITHUB_WORKSPACE" --github required --github-repo "$GITHUB_REPOSITORY" --output branchquilt --timeout 600 --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branchquilt-report
          path: branchquilt/index.html
          retention-days: 7
          if-no-files-found: error
